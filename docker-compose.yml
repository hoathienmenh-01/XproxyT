# Luna-Proxy Docker Compose
# Usage: docker-compose up -d

version: '3.8'

services:
  luna-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luna-proxy
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - luna-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      # Qwen credentials (optional, can be set via UI)
      - QWEN_AI_TOKEN=${QWEN_AI_TOKEN:-}
      - QWEN_AI_COOKIES=${QWEN_AI_COOKIES:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  luna-data:
    driver: local